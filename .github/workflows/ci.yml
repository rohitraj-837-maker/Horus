# Same checks as `make check` plus the README number check. Offline by design: the
# pytest defaults deselect the trino / network / bundle markers (pyproject.toml), and
# no test reads data/ (bulk data is gitignored and never needed in CI).
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Types
        run: uv run mypy horus/core horus/eval
      - name: Tests
        run: uv run pytest -q
      - name: README numbers match reports/
        run: uv run python scripts/readme_numbers.py --check
