[project]
name = "turbcast"
version = "0.1.0"
description = "Live turbulence detection and nowcasting from ADS-B, validated against PIREPs"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "polars>=1.0",
    "pyarrow>=16",
    "duckdb>=1.0",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "h3>=4.1",
    "xarray>=2024.6",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "matplotlib>=3.9",
    "tabulate>=0.10.0",
]

[project.optional-dependencies]
trino = ["pyopensky>=2.0"]

[dependency-groups]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["turbcast"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "trino: needs OpenSky Trino research credentials",
    "network: hits a live external API",
]
addopts = "-m 'not trino and not network'"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]  # verbatim real report strings in test tables

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
